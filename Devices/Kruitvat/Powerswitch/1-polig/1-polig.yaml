substitutions:
  device_name: ps
  device_friendlyname: PowerSwitch
  device_discription: "power switch"


bk72xx:
  board: generic-bk7231n-qfn32-tuya

esphome:
  name: ${device_name}
  friendly_name: ${device_friendlyname}
  comment: "${device_discription}"
  name_add_mac_suffix: false
  project:
    name: heronet.${device_name}
    version: ${version}

wifi:
  # Remove leading '#' and fill in your wifi details
  #ssid: !secret wifi_ssid
  #password: !secret wifi_password
  # Remove leading '#' if you want to use a hidden ssid
  #hidden: True

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: ${device_name}
    #password: !secret fallback_password
    ap_timeout: 30s

ota:
  - platform: esphome
    #password: !secret ota_password

api:
  #encryption:
    #key: !secret api_key

dashboard_import:
  package_import_url: github://heronetnl/Herotools/Devices/Kruitvat/Powerswitch/1-polig/1-polig.yaml@main
  import_full_config: true

packages:
  remote_package:
    url: https://github.com/heronetnl/Herotools
    ref: main
    # Get file's
    files:
      # Get basic file
      - Scripts/Basic.yaml

      # Get language file
      - Scripts/Language/nl-NL.yaml

      - Scripts/Devices/Kruitvat/Powerswitch/1-polig/Main.yaml

    refresh: 0d

web_server:
  port: 80
  #auth:
    #username: !secret web_user
    #password: !secret web_pass

captive_portal:

mdns:
