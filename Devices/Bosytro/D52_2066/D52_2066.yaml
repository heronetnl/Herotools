substitutions:
  device_name: d52-2066
  device_friendlyname: d52-2066
  device_discription: "d52-2066"

bk72xx:
  board: cbu
  framework:
    type: esp-idf

esphome:
  name: ${device_name}
  friendly_name: ${device_friendlyname}
  comment: "${device_discription}"
  name_add_mac_suffix: true
  project:
    name: heronet.${device_name}
    version: ${version}

wifi:
  # Remove leading '#' and fill in your wifi details
  #ssid: !secret wifi_ssid
  #password: !secret wifi_password
  # Remove leading '#' if you want to use a hidden ssid
  #fast_connect: True

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: ${device_name}
    #password: !secret fallback_password
    ap_timeout: 30s

ota:
  - platform: esphome
    #password !secret ota_password

api:
  #encryption:
    #key: !secret api_key

dashboard_import:
  package_import_url: github://heronetnl/Herotools/Devices/Bosytro/D52_2066/D52_2066.yaml@main
  import_full_config: true

packages:
  remote_package:
    url: https://github.com/heronetnl/Herotools
    ref: main
    # Get file's
    files:
      # Get basic file
      - Scripts/Basic.yaml

      # Get language file
      - Scripts/Language/nl-NL.yaml

      # Get protocols file's
      - Scripts/Protocols/BK71xx/UART/uart_1.yaml

      # Get main file's
      - Scripts/Devices/Bosytro/D52_2066/D52_2066.yaml

    refresh: 0d

web_server:
  port: 80
  #auth:
    #username: !secret web_user
    #password: !secret web_pass

captive_portal:

mdns: